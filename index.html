<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Leiðin</title>
<style>
  :root {
    --bg: #16191b;
    --ink: #e8ebe6;
    --ink-soft: #98a19a;
    --line: #2c3230;
    --glacier: #5fb3ac;
    --glacier-deep: #8fd4ce;
    --warn: #e0754f;
    --card-bg: #1e2322;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  #app {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 18px 28px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .wordmark {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .due-count {
    font-size: 13px;
    color: var(--ink-soft);
  }
  .icon-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
  }
  .icon-btn:active { color: var(--ink); }

  main { flex: 1; display: flex; flex-direction: column; }

  /* ---- Review card ---- */
  .review-shell {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 48px 24px;
    text-align: center;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
  }
  .card .prompt {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card .answer {
    font-size: 20px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 14px;
    margin-top: 4px;
    width: 100%;
  }
  .card .category-tag {
    font-size: 12px;
    color: var(--glacier);
    text-transform: lowercase;
  }
  .card .mnemonic {
    font-size: 14px;
    color: var(--glacier-deep);
    font-style: italic;
    max-width: 280px;
  }
  .card .tap-hint {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .grades {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .grades button {
    padding: 14px 4px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--card-bg);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
  }
  .grades button:active { background: var(--bg); }
  .grades .didnt { color: var(--warn); }
  .grades .unsure { color: #c9a227; }
  .grades .ez { color: var(--glacier-deep); }

  .empty-state {
    text-align: center;
    padding: 60px 12px;
    color: var(--ink-soft);
  }
  .empty-state .big { font-size: 17px; color: var(--ink); margin-bottom: 8px; }

  /* ---- Settings ---- */
  .panel {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .panel h3 {
    font-size: 13px;
    text-transform: lowercase;
    color: var(--ink-soft);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .cat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .count { color: var(--ink-soft); font-size: 13px; }
  .toggle {
    width: 40px; height: 24px;
    border-radius: 12px;
    background: var(--line);
    position: relative;
    cursor: pointer;
    border: none;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--glacier); }
  .toggle::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: white;
    transition: transform .15s ease;
  }
  .toggle.on::after { transform: translateX(16px); }
  .text-btn {
    background: none;
    border: none;
    color: var(--glacier);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 10px 0;
  }
  .back-row { margin-bottom: 18px; }
  .note {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  /* ---- Onboarding import ---- */
  .import-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .import-row .term { font-size: 15px; }
  .import-row .term .en { display: block; font-size: 12px; color: var(--ink-soft); }
  .import-grades { display: flex; gap: 6px; }
  .import-grades button {
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--card-bg);
    cursor: pointer;
  }
  .import-grades button.chosen.didnt { background: var(--warn); color: white; border-color: var(--warn); }
  .import-grades button.chosen.unsure { background: #c9a227; color: white; border-color: #c9a227; }
  .import-grades button.chosen.ez { background: var(--glacier-deep); color: white; border-color: var(--glacier-deep); }
</style>
</head>

const CATEGORY_LABELS = {
  road: "Road", restaurant: "Restaurant", grocery: "Grocery",
  danger: "Danger / safety", greetings: "Greetings"
};

/* =========================================================
   STORAGE
   NOTE: uses localStorage so progress survives closing the
   browser tab — open this file directly (double-click, or
   your own simple local server) for that to persist. If it's
   ever previewed inside a sandboxed embed rather than opened
   as a real file, storage may not be available; the app still
   works, it just won't remember between sessions in that case.
   ========================================================= */
const STORE_KEY = "leidin_state_v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* storage unavailable — fall through */ }
  return { cards: {}, settings: { activeCats: Object.keys(CATEGORY_LABELS), dailyNewLimit: 12, onboarded: false } };
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

let state = loadState();
CARDS.forEach(c => {
  if (!state.cards[c.id]) {
    state.cards[c.id] = {
      p: PRIOR_P(c.diff),
      history: [],
      nextDue: null // null = never studied, eligible as "new"
    };
  }
});

function PRIOR_P(diff) {
  if (diff === "cognate") return 0.8;
  if (diff === "opaque") return 0.3;
  return 0.5;
}

/* =========================================================
   SCHEDULING
   ========================================================= */
function daysUntilTrip() {
  const now = new Date();
  return Math.ceil((TRIP_DATE - now) / (1000 * 60 * 60 * 24));
}

function applyGrade(cardId, grade) {
  const c = state.cards[cardId];
  const def = CARDS.find(x => x.id === cardId);
  if (grade === "didnt") c.p = c.p * 0.5;
  if (grade === "unsure") c.p = c.p + (1 - c.p) * 0.15;
  if (grade === "ez") c.p = c.p + (1 - c.p) * 0.4;
  c.p = Math.max(0.05, Math.min(0.97, c.p));

  const gapDays = intervalFromP(c.p);
  const runwayLeft = daysUntilTrip();
  const now = new Date();
  let due;
  if (runwayLeft < 7) {
    // runway override: always eligible again next session
    due = new Date(now.getTime() + 8 * 60 * 60 * 1000); // ~8hrs, i.e. "next session"
  } else {
    due = new Date(now.getTime() + gapDays * 24 * 60 * 60 * 1000);
  }
  c.history.push({ grade, at: now.toISOString() });
  c.nextDue = due.toISOString();
  saveState();
}

function intervalFromP(p) {
  if (p < 0.5) return 1;
  if (p < 0.7) return 2;
  if (p < 0.85) return 4;
  return 7;
}

function seedOnboard(cardId, grade) {
  // synthetic single history entry through the same update rule
  applyGrade(cardId, grade);
}

/* =========================================================
   QUEUE BUILDING
   ========================================================= */
function newCardsIntroducedToday() {
  const todayStr = new Date().toDateString();
  let count = 0;
  Object.values(state.cards).forEach(c => {
    if (c.history.length && new Date(c.history[0].at).toDateString() === todayStr) count++;
  });
  return count;
}

function buildQueue() {
  const now = new Date();
  const activeCats = state.settings.activeCats;
  const pool = CARDS.filter(c => activeCats.includes(c.cat));

  const due = pool.filter(c => {
    const s = state.cards[c.id];
    return s.nextDue && new Date(s.nextDue) <= now;
  });

  const brandNew = pool.filter(c => !state.cards[c.id].nextDue && state.cards[c.id].history.length === 0);
  const remainingNewAllowed = Math.max(0, state.settings.dailyNewLimit - newCardsIntroducedToday());
  const newBatch = brandNew.slice(0, remainingNewAllowed);

  const queue = due.concat(newBatch);
  // interleave: shuffle
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  return queue;
}

function dueCountToday() {
  return buildQueue().length;
}

/* =========================================================
   RENDER
   ========================================================= */
const app = document.getElementById("app");
let currentQueue = [];
let currentIndex = 0;
let revealed = false;
let view = "review"; // review | settings | onboard

function render() {
  if (view === "settings") return renderSettings();
  if (view === "onboard") return renderOnboard();
  return renderReview();
}

function renderReview() {
  if (currentIndex >= currentQueue.length) {
    currentQueue = buildQueue();
    currentIndex = 0;
  }
  const total = currentQueue.length;

  let cardHtml;
  if (total === 0) {
    cardHtml = `<div class="empty-state">
      <div class="big">Nothing due right now</div>
      <div>Check back later, or open settings to add categories.</div>
    </div>`;
  } else {
    const c = currentQueue[currentIndex];

    cardHtml = `
      <div class="card" id="cardTap">
        <div class="prompt">${c.is}</div>
        ${revealed ? `<div class="answer">${c.en}</div>` : `<div class="tap-hint">tap to reveal</div>`}
        ${revealed ? `<div class="category-tag">${CATEGORY_LABELS[c.cat]}</div>` : ""}
        ${revealed && c.mn ? `<div class="mnemonic">${c.mn}</div>` : ""}
      </div>
      ${revealed ? `
        <div class="grades">
          <button class="didnt" data-grade="didnt">Didn't know</button>
          <button class="unsure" data-grade="unsure">Unsure</button>
          <button class="ez" data-grade="ez">Ez pz</button>
        </div>
      ` : ""}
    `;
  }

  app.innerHTML = `
    <header>
      <div class="wordmark">Leiðin</div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="due-count">${dueCountToday()} due</div>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
      </div>
    </header>
    <main>
      <div class="review-shell">
        ${cardHtml}
      </div>
    </main>
  `;

  document.getElementById("settingsBtn").onclick = () => { view = "settings"; render(); };

  const tap = document.getElementById("cardTap");
  if (tap && !revealed) {
    tap.onclick = () => { revealed = true; render(); };
  }
  document.querySelectorAll("[data-grade]").forEach(btn => {
    btn.onclick = () => {
      const c = currentQueue[currentIndex];
      const grade = btn.dataset.grade;
      applyGrade(c.id, grade);
      revealed = false;
      currentIndex++;
      if (grade === "didnt") {
        // Expanding retrieval (Landauer & Bjork 1978): a missed card
        // resurfaces later in *this* session, interleaved with others,
        // rather than waiting for the next-day fallback set above.
        const offset = 4 + Math.floor(Math.random() * 4); // 4–7 cards ahead
        const insertAt = Math.min(currentQueue.length, currentIndex + offset);
        currentQueue.splice(insertAt, 0, c);
      }
      render();
    };
  });
}

function renderSettings() {
  const catRows = Object.keys(CATEGORY_LABELS).map(cat => {
    const on = state.settings.activeCats.includes(cat);
    const count = CARDS.filter(c => c.cat === cat).length;
    return `
      <div class="cat-row">
        <div>${CATEGORY_LABELS[cat]} <span class="count">(${count})</span></div>
        <button class="toggle ${on ? "on" : ""}" data-cat="${cat}"></button>
      </div>
    `;
  }).join("");

  const runway = daysUntilTrip();

  app.innerHTML = `
    <header>
      <button class="icon-btn back-row" id="backBtn">← back</button>
    </header>
    <main>
      <div class="panel">
        <h3>trip countdown</h3>
        <div class="note">${runway} day${runway === 1 ? "" : "s"} until Sept 19. ${runway < 7 ? "Runway override is active — cards you review now stay in daily rotation until the trip." : ""}</div>
      </div>
      <div class="panel">
        <h3>categories</h3>
        ${catRows}
      </div>
      <div class="panel">
        <h3>known words</h3>
        <div class="note">Already know some of these? Import them so they start at the right level instead of showing up as brand new.</div>
        <button class="text-btn" id="onboardBtn">Import known words →</button>
      </div>
    </main>
  `;

  document.getElementById("backBtn").onclick = () => { view = "review"; render(); };
  document.getElementById("onboardBtn").onclick = () => { view = "onboard"; render(); };
  document.querySelectorAll("[data-cat]").forEach(btn => {
    btn.onclick = () => {
      const cat = btn.dataset.cat;
      const idx = state.settings.activeCats.indexOf(cat);
      if (idx >= 0) state.settings.activeCats.splice(idx, 1);
      else state.settings.activeCats.push(cat);
      saveState();
      renderSettings();
    };
  });
}

function renderOnboard() {
  const rows = CARDS.map(c => {
    const s = state.cards[c.id];
    const lastGrade = s.history.length ? s.history[s.history.length - 1].grade : null;
    return `
      <div class="import-row">
        <div class="term">${c.is}<span class="en">${c.en}</span></div>
        <div class="import-grades">
          <button data-id="${c.id}" data-grade="didnt" class="${lastGrade === "didnt" ? "chosen didnt" : ""}">Didn't know</button>
          <button data-id="${c.id}" data-grade="unsure" class="${lastGrade === "unsure" ? "chosen unsure" : ""}">Unsure</button>
          <button data-id="${c.id}" data-grade="ez" class="${lastGrade === "ez" ? "chosen ez" : ""}">Ez pz</button>
        </div>
      </div>
    `;
  }).join("");

  app.innerHTML = `
    <header>
      <button class="icon-btn back-row" id="backBtn">← done</button>
    </header>
    <main>
      <div class="panel">
        <h3>import known words</h3>
        <div class="note">Tap how well you already know each word. Skip any you're unsure about — they'll just show up as new.</div>
      </div>
      <div class="panel">
        ${rows}
      </div>
    </main>
  `;
  document.getElementById("backBtn").onclick = () => { view = "settings"; render(); };
  document.querySelectorAll("[data-grade]").forEach(btn => {
    btn.onclick = () => {
      seedOnboard(btn.dataset.id, btn.dataset.grade);
      renderOnboard();
    };
  });
}

render();
</script>
</body>
</html>
